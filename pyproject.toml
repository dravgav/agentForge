[project]
name = "engineering_team"
version = "0.1.0"
description = "Four-agent CrewAI software engineering workflow with Docker-based code execution"

requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7",
    "python-dotenv>=1,<2",
]

[project.scripts]
engineering_team = "engineering_team.main:run"
run_crew = "engineering_team.main:run"
train = "engineering_team.main:train"
replay = "engineering_team.main:replay"
test = "engineering_team.main:test"
run_with_trigger = "engineering_team.main:run_with_trigger"
launch_generated_app = "engineering_team.launcher:launch_generated_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.workspace]
members = []
exclude = ["sandbox"]